*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--cream);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

button:active{transform:scale(.95)}
button:disabled{opacity:.4;cursor:default}

.langs{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:30;display:flex;gap:4px}
.langs[hidden]{display:none}
.langs button{padding:4px 7px;font-size:1.25rem;background:rgba(42,15,20,.6);border-color:transparent;opacity:.55}
.langs button.cur{opacity:1;border-color:var(--gold)}

.card[hidden],#hud[hidden]{display:none}
.logo{width:64px;height:64px;display:block;margin:0 auto 4px}
.brand{font-weight:900;letter-spacing:.25em;color:var(--red);font-size:.85rem}
h1{font-size:2.4rem;color:var(--gold);text-shadow:0 0 22px rgba(232,179,60,.55);margin:2px 0}
h2{font-size:1.6rem;color:var(--gold);margin-bottom:6px}
.tag{color:var(--muted);margin-bottom:12px;line-height:1.35}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.how{list-style:none;color:var(--muted);font-size:.86rem;line-height:1.5;margin-top:10px}
.small{font-size:.78rem;color:var(--muted);margin-top:10px}
.small a{color:var(--muted)}
.love{color:var(--gold);font-style:italic;margin:6px 0}
.stat{font-size:1.1rem;margin:4px 0}.stat b{color:var(--gold)}
.coins{color:var(--gold);font-weight:800;font-size:1.2rem;margin:4px 0 8px}

.up .ic{font-size:1.5rem;width:30px;text-align:center}
.up .nm{flex:1}.up .nm b{display:block;font-size:.95rem}.up .nm small{color:var(--muted);font-size:.72rem}
.pips{display:flex;gap:2px;margin-top:3px}.pips i{width:8px;height:5px;border-radius:2px;background:#5a3a3f}.pips i.on{background:var(--gold)}
.up button{min-width:74px;padding:7px 8px;font-weight:700;background:var(--gold);color:var(--bg2);border:0}
.up button:disabled{background:#5a3a3f;color:var(--muted)}

#pauseBtn{pointer-events:auto;padding:6px 12px;font-size:1.1rem;background:rgba(42,15,20,.6)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:40;background:var(--cream);color:var(--bg2);padding:8px 16px;border-radius:20px;font-weight:700;transition:.25s;pointer-events:none}
