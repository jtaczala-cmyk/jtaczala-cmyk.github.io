<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Lava Marble – Stop60 (test)</title>
<meta name="theme-color" content="#12110f">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/lavakule/t-test-m4r9/style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div class="badge" data-t="test">TEST</div>
<nav class="langs"><a href="/lavakule/t-test-m4r9/" class="" aria-label="Norsk">🇳🇴</a><a href="/lavakule/t-test-m4r9/pl/" class="" aria-label="Polski">🇵🇱</a><a href="/lavakule/t-test-m4r9/en/" class="cur" aria-label="English">🇬🇧</a></nav>
<section id="menu" class="card">
  <div class="brand">STOP60</div>
  <h1 data-t="title"></h1>
  <p class="tag" data-t="tag"></p>
  <p class="best"><span data-t="best"></span>: <b id="bestVal">0</b></p>
  <button id="startBtn" class="big" data-t="start"></button>
  <div class="row"><button id="dailyBtn" data-t="daily"></button><button id="shopBtn" data-t="shop"></button><button id="missBtn" data-t="missions"></button></div>
  <div id="shop" class="panel" hidden><p class="small"><span data-t="bank"></span>: <b id="bankVal">0</b> 🪙</p><div id="shopList"></div></div>
  <div id="miss" class="panel" hidden><ul id="missList"></ul></div>
  <ul class="how"><li data-t="howTilt"></li><li data-t="howKb"></li><li data-t="pu"></li></ul>
  <p class="warn">⚠ <span data-t="flash"></span></p>
  <p class="small"><span data-t="local"></span> · <a href="/lavakule/t-test-m4r9/lisenser.html" data-t="lic"></a></p>
</section>
<div id="hud" hidden>
  <div class="top"><div><small data-t="score"></small><b id="hScore">0</b></div><div><small data-t="dist"></small><b id="hDist">0</b></div><div><small data-t="coins"></small><b id="hCoins">0</b></div><div><b id="hp" class="hp">●●●</b></div></div>
  <div id="heat"><small data-t="heat"></small><i><span id="heatBar"></span></i></div>
  <div class="pus" id="pus"></div>
  <div class="tools"><button id="calBtn" data-t="calib"></button><button id="pauseBtn" aria-label="Pause">❚❚</button></div>
  <div class="pad"><button data-b="btnS:-1" aria-label="left">◀</button><button data-b="btnG:-1" aria-label="slower">▼</button><button data-b="btnG:1" aria-label="faster">▲</button><button data-b="btnS:1" aria-label="right">▶</button></div>
</div>
<section id="pauseBox" class="card" hidden><h2>❚❚</h2><button id="resumeBtn" class="big">▶</button></section>
<section id="over" class="card" hidden>
  <h2 data-t="over"></h2><p id="ovReason" class="tag"></p>
  <p id="newBest" class="nb" data-t="newbest" hidden></p>
  <div class="stats"><div><small data-t="score"></small><b id="ovScore"></b></div><div><small data-t="dist"></small><b id="ovDist"></b></div><div><small data-t="coins"></small><b id="ovCoins"></b></div><div><small data-t="best"></small><b id="ovBest"></b></div></div>
  <p id="ovExtra" class="small"></p>
  <button id="againBtn" class="big" data-t="again"></button> <button id="menuBtn" data-t="menu"></button>
</section>
<div id="toast"></div>
<script type="module" src="/lavakule/t-test-m4r9/game.js"></script>
</body>
</html>
