  B.s = Math.floor(Math.min(aw / L.w, ah / L.h, 64)); B.x = Math.round((W - B.s * L.w) / 2); B.y = Math.round(top + (ah - B.s * L.h) / 2);
}
addEventListener("resize", resize);

/* ---------- game flow ---------- */
function stars(m, o){ return m <= o ? 3 : m <= o + Math.max(2, Math.ceil(o * .4)) ? 2 : 1; }
function unlocked(i){ return i === 0 || !!P.stars[i-1] || !!P.stars[i]; }
function firstOpen(){ for (var i = 0; i < LEVELS.length; i++) if (!P.stars[i]) return i; return 0; }
function show(id){ ["menu","levels","done","end"].forEach(function(s){ $(s).hidden = s !== id; }); var inGame = !id; $("hud").hidden = !inGame && id !== "done"; $("bar").hidden = !inGame; }
function load(i){
  li = i; L = AX.parse(LEVELS[i].rows); st = AX.init(L); moves = 0; hist = []; anim = null; queue = null; winT = 0;
  disp = {x:st.x, y:st.y, par:0, km:0, dm:0, keys:0}; particles = []; tutorial = i === 0 && !P.stars[0];
  fit(); playing = true; show(null); hud(); setHint();
}
function hud(){
  $("hLevel").textContent = (li + 1) + "/" + LEVELS.length; $("hMoves").textContent = moves; $("hTarget").textContent = "≤ " + LEVELS[li].opt;
  $("hKeys").hidden = !L.keys.length; $("hKeyN").textContent = disp ? disp.keys : 0;
}
function setHint(){ var h = T[lang].hints[li + 1]; $("hint").textContent = h || ""; }
function toast(m){ var e = $("toast"); e.textContent = m; e.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function(){ e.classList.remove("show"); }, 1800); }

function move(dir){
  if (!playing || winT) return; audio();
  if (anim){ queue = dir; return; }
  var r = AX.step(L, st, dir); var d = AX.DIRS[dir]; face = d;
  if (!r){ squash = .5; SFX.bump(); buzz(8); bumpDir = d; bumpT = 1; return; }
  tutorial = false; hist.push({s: st, m: moves}); moves++;
  anim = {from: [st.x, st.y], path: r.path, i: 0, f: 0, r: r, dir: d, prev: st};
  st = r.s; SFX.slide(); hud();
}
var bumpDir = [0,0], bumpT = 0;
function undo(){ if (anim || !hist.length || winT) return; var h = hist.pop(); st = h.s; moves = h.m; syncDisp(); SFX.undo(); hud(); }
function syncDisp(){ disp = {x:st.x, y:st.y, par:st.par, km:st.km, dm:st.dm, keys:st.keys}; }
function restart(){ if (winT) return; load(li); SFX.undo(); }
$("undoBtn").onclick = undo; $("restartBtn").onclick = restart;

function finishAnim(){
  var r = anim.r; anim = null;
  if (r.dead){
    SFX.dead(); buzz(90); shake = 12; flash = 1; flashCol = "215,38,46"; burst(disp.x, disp.y, "#D7262E", 26);
    var h = hist.pop(); st = h.s; moves = h.m; setTimeout(function(){ syncDisp(); hud(); }, 380); toast(t("ouch")); return;
  }
  squash = 1; if (!r.win){ SFX.bump(); buzz(10); }
  if (r.win){ win(); return; }
  if (queue){ var q = queue; queue = null; move(q); }
}
function win(){
  winT = 1; SFX.win(); buzz([30,40,30]); flash = .8; flashCol = "63,199,168"; burst(st.x, st.y, "#3FC7A8", 40); burst(st.x, st.y, "#E8B33C", 24);
  var s = stars(moves, LEVELS[li].opt); P.stars[li] = Math.max(P.stars[li] || 0, s); save();
  setTimeout(function(){
    playing = false;
    if (li === LEVELS.length - 1){ endScreen(); return; }
    $("doneInfo").textContent = t("doneInfo").replace("{m}", moves).replace("{o}", LEVELS[li].opt);
    var sp = $("doneStars").children; for (var k = 0; k < 3; k++){ sp[k].className = ""; }
    show("done"); $("hud").hidden = false;
    for (var k2 = 0; k2 < 3; k2++) (function(k){ setTimeout(function(){ sp[k].className = k < s ? "on" : "off"; if (k < s){ tone(660 + k*220, .15, "triangle", .1); buzz(15); } }, 250 + k*230); })(k2);
  }, 900);
}
function totalStars(){ return P.stars.reduce(function(a,b){ return a + (b||0); }, 0); }
function endScreen(){
  $("endStars").textContent = totalStars(); $("endMax").textContent = LEVELS.length * 3; show("end");
  try { window.goatcounter && goatcounter.count && goatcounter.count({path:"aximore-finished", title:"aximore finished", event:true}); } catch(e){}
}
$("nextBtn").onclick = function(){ load(li + 1); };
$("replayBtn").onclick = function(){ load(li); };
function openLevels(){
  playing = false; var g = $("grid"); g.innerHTML = "";
  LEVELS.forEach(function(_, i){ var b = document.createElement("button"), s = P.stars[i] || 0;
    b.innerHTML = (i + 1) + "<small>" + (s ? "★★★".slice(0, s) + "☆☆☆".slice(0, 3 - s) : unlocked(i) ? "☆☆☆" : "🔒") + "</small>";
    b.disabled = !unlocked(i); b.onclick = function(){ load(i); }; g.appendChild(b); });
  show("levels");
}
$("levelsBtn").onclick = openLevels; $("levelsBtn2").onclick = openLevels; $("doneLevels").onclick = openLevels; $("endLevels").onclick = openLevels;
function menu(){ playing = false; L = L; $("progStars").textContent = totalStars(); $("progMax").textContent = LEVELS.length * 3; show("menu"); applyLang(); }
$("levelsBack").onclick = menu; $("endMenu").onclick = menu;
$("playBtn").onclick = function(){ audio(); load(firstOpen()); };
function share(){
  var u = location.origin + location.pathname, ti = document.title;
  if (navigator.share){ navigator.share({title: ti, url: u}).catch(function(){}); }
  else if (navigator.clipboard){ navigator.clipboard.writeText(u).then(function(){ toast(t("copied")); }); }
  try { window.goatcounter && goatcounter.count && goatcounter.count({path:"aximore-share", title:"aximore share", event:true}); } catch(e){}
}
$("shareBtn").onclick = share; $("endShare").onclick = share;

/* ---------- input ---------- */
var sw = null;
cv.addEventListener("pointerdown", function(e){ if (!playing) return; e.preventDefault(); audio(); sw = {id: e.pointerId, x: e.clientX, y: e.clientY, done: false}; });
cv.addEventListener("pointermove", function(e){
  if (!sw || e.pointerId !== sw.id || sw.done) return; var dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 22){ sw.done = true; move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "R" : "L") : (dy > 0 ? "D" : "U")); }
});
function swEnd(e){ if (!sw || e.pointerId !== sw.id) return; var dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.done && Math.max(Math.abs(dx), Math.abs(dy)) > 12) move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "R" : "L") : (dy > 0 ? "D" : "U")); sw = null; }
cv.addEventListener("pointerup", swEnd); cv.addEventListener("pointercancel", function(){ sw = null; });
document.addEventListener("touchmove", function(e){ if (e.cancelable && !(e.target.closest && e.target.closest(".card"))) e.preventDefault(); }, {passive: false});
addEventListener("keydown", function(e){
  var k = e.key, m = {ArrowUp:"U", ArrowDown:"D", ArrowLeft:"L", ArrowRight:"R", w:"U", s:"D", a:"L", d:"R", W:"U", S:"D", A:"L", D:"R"}[k];
  if (m && playing){ e.preventDefault(); move(m); }
  else if ((k === "z" || k === "u" || k === "Backspace") && playing){ e.preventDefault(); undo(); }
  else if (k === "r" && playing) restart();
  else if (k === "Enter" && !$("done").hidden) load(li + 1);
});

/* ---------- drawing ---------- */
function burst(cx, cy, col, n){ for (var i = 0; i < n; i++){ var a = Math.random() * 6.283, v = 1 + Math.random() * 4; particles.push({x: cx + .5, y: cy + .5, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: 1, c: col, r: 2 + Math.random() * 3}); } }
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function drawBoard(){
  var s = B.s, pulse = (Math.sin(tNow * 3) + 1) / 2;
  // floor
  for (var y = 0; y < L.h; y++) for (var x = 0; x < L.w; x++){
    var c = L.g[y * L.w + x], px = B.x + x * s, py = B.y + y * s;
    if (c === "#") continue;
    ctx.fillStyle = (x + y) % 2 ? "#3D1A1F" : "#411C22"; ctx.fillRect(px, py, s, s);
  }
  for (y = 0; y < L.h; y++) for (x = 0; x < L.w; x++){
    c = L.g[y * L.w + x]; px = B.x + x * s; py = B.y + y * s; var cx = px + s / 2, cy = py + s / 2;
    if (c === "#"){
      ctx.fillStyle = "#1c070b"; ctx.fillRect(px, py + s * .1, s, s * .9);
      ctx.fillStyle = "#5C1A24"; rr(px + 1, py, s - 2, s - 3, s * .14); ctx.fill();
      ctx.fillStyle = "#7A2A34"; rr(px + 1, py, s - 2, s * .22, s * .12); ctx.fill();
      ctx.strokeStyle = "rgba(246,238,220,.08)"; ctx.lineWidth = 1; rr(px + 1.5, py + .5, s - 3, s - 4, s * .14); ctx.stroke();
    } else if (c === "o"){
      ctx.strokeStyle = "rgba(232,179,60,.85)"; ctx.lineWidth = Math.max(2, s * .07); ctx.beginPath(); ctx.arc(cx, cy, s * .28, 0, 6.283); ctx.stroke();
      ctx.fillStyle = "rgba(232,179,60,.15)"; ctx.fill();
    } else if (c === "X"){
      ctx.fillStyle = "rgba(215,38,46," + (.75 + pulse * .25) + ")"; rr(px + 2, py + 2, s - 4, s - 4, s * .18); ctx.fill();
      ctx.strokeStyle = "rgba(255,190,120,.55)"; ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(px + s * .25, py + s * .3); ctx.lineTo(px + s * .45, py + s * .5); ctx.lineTo(px + s * .35, py + s * .75);
      ctx.moveTo(px + s * .7, py + s * .22); ctx.lineTo(px + s * .58, py + s * .5); ctx.lineTo(px + s * .78, py + s * .7); ctx.stroke();
      ctx.shadowColor = "#D7262E"; ctx.shadowBlur = 12 * pulse; ctx.strokeStyle = "rgba(215,38,46,.6)"; rr(px + 2, py + 2, s - 4, s - 4, s * .18); ctx.stroke(); ctx.shadowBlur = 0;
    } else if (c === "1" || c === "2"){
      var on = disp.par & (c === "1" ? 1 : 2), col = COL[c];
      ctx.fillStyle = "#2A0F14"; ctx.beginPath(); ctx.arc(cx, cy, s * .34, 0, 6.283); ctx.fill();
      ctx.fillStyle = col; ctx.globalAlpha = on ? 1 : .75; ctx.beginPath(); ctx.arc(cx, cy + (on ? 1 : -1), s * .24, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
      ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.beginPath(); ctx.arc(cx - s * .07, cy - s * .08, s * .06, 0, 6.283); ctx.fill();
    } else if ("RrBb".indexOf(c) >= 0){
      var col2 = COL[c === "R" || c === "r" ? 1 : 2], closed = AX.gateClosed(c, disp.par);
      if (closed){
        ctx.fillStyle = col2; rr(px + 3, py + 3, s - 6, s - 6, s * .12); ctx.fill();
        ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = s * .08; ctx.beginPath();
        for (var k = -1; k < 3; k++){ ctx.moveTo(px + k * s * .33 + 3, py + s - 3); ctx.lineTo(px + (k + 1) * s * .33 + 3, py + 3); } ctx.save(); rr(px + 3, py + 3, s - 6, s - 6, s * .12); ctx.clip(); ctx.stroke(); ctx.restore();
      } else { ctx.strokeStyle = col2; ctx.globalAlpha = .55; ctx.setLineDash([4, 4]); ctx.lineWidth = 2; rr(px + 4, py + 4, s - 8, s - 8, s * .12); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1; }
    } else if (c === "k"){
      if (!(disp.km & (1 << L.keys.indexOf(x + "," + y)))){
        var by = Math.sin(tNow * 4 + x) * s * .05; ctx.save(); ctx.translate(cx, cy + by); ctx.rotate(-.6);
        ctx.shadowColor = "#E8B33C"; ctx.shadowBlur = 10; ctx.strokeStyle = "#E8B33C"; ctx.lineWidth = s * .09;
        ctx.beginPath(); ctx.arc(-s * .12, 0, s * .12, 0, 6.283); ctx.moveTo(0, 0); ctx.lineTo(s * .28, 0); ctx.moveTo(s * .2, 0); ctx.lineTo(s * .2, s * .1); ctx.stroke(); ctx.restore(); ctx.shadowBlur = 0;
      }
    } else if (c === "D"){
      if (!(disp.dm & (1 << L.doors.indexOf(x + "," + y)))){
        ctx.fillStyle = "#8A5A2B"; rr(px + 3, py + 2, s - 6, s - 4, s * .1); ctx.fill(); ctx.strokeStyle = "#5e3a1a"; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = "#E8B33C"; ctx.beginPath(); ctx.arc(cx, cy - s * .05, s * .08, 0, 6.283); ctx.fill(); ctx.fillRect(cx - s * .03, cy, s * .06, s * .16);
      } else { ctx.strokeStyle = "rgba(138,90,43,.5)"; ctx.lineWidth = 2; rr(px + 4, py + 4, s - 8, s - 8, 4); ctx.stroke(); }
    } else if (">^<v".indexOf(c) >= 0){
      var ang = {">":0, "v":Math.PI/2, "<":Math.PI, "^":-Math.PI/2}[c], off = ((tNow * 1.2) % 1) * s * .2;
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang); ctx.strokeStyle = "rgba(246,238,220,.8)"; ctx.lineWidth = Math.max(2, s * .08); ctx.lineCap = "round";
      for (var a = 0; a < 2; a++){ var ox = -s * .18 + a * s * .22 + off; ctx.globalAlpha = .45 + a * .45; ctx.beginPath(); ctx.moveTo(ox - s * .1, -s * .16); ctx.lineTo(ox + s * .06, 0); ctx.lineTo(ox - s * .1, s * .16); ctx.stroke(); }
      ctx.restore(); ctx.globalAlpha = 1;
    } else if (c === "G"){
      ctx.save(); ctx.translate(cx, cy); ctx.shadowColor = "#3FC7A8"; ctx.shadowBlur = 18 + pulse * 10;
      ctx.fillStyle = "rgba(63,199,168,.25)"; ctx.beginPath(); ctx.arc(0, 0, s * .4, 0, 6.283); ctx.fill();
      ctx.rotate(tNow * 1.6); ctx.strokeStyle = "#3FC7A8"; ctx.lineWidth = s * .08;
      for (var q = 0; q < 3; q++){ ctx.beginPath(); ctx.arc(0, 0, s * .3, q * 2.094, q * 2.094 + 1.3); ctx.stroke(); }
      ctx.shadowBlur = 0; ctx.fillStyle = "#bff3e6"; ctx.beginPath(); ctx.arc(0, 0, s * .1 + pulse * s * .03, 0, 6.283); ctx.fill(); ctx.restore();
    }
  }
}
function drawHero(){
  var s = B.s, hx = disp.x, hy = disp.y;
  if (bumpT > 0){ hx += bumpDir[0] * .08 * bumpT; hy += bumpDir[1] * .08 * bumpT; }
  var cx = B.x + (hx + .5) * s, cy = B.y + (hy + .5) * s, moving = !!anim;
  var sx = 1, sy = 1;
  if (moving){ if (face[0]) { sx = 1.12; sy = .9; } else { sx = .9; sy = 1.12; } }
  if (squash > 0){ var q = Math.sin(squash * Math.PI) * .22; if (face[0]) { sx = 1 - q; sy = 1 + q; } else { sx = 1 + q; sy = 1 - q; } }
  var win = winT ? Math.min(1, winT) : 0, size = s * .66 * (1 - win * .6);
  ctx.save(); ctx.translate(cx, cy + Math.sin(tNow * 3) * s * .02 * (moving ? 0 : 1)); ctx.rotate(win * 6); ctx.scale(sx, sy);
  ctx.shadowColor = "#E8B33C"; ctx.shadowBlur = 22; ctx.fillStyle = "#E8B33C"; rr(-size / 2, -size / 2, size, size, size * .28); ctx.fill(); ctx.shadowBlur = 0;
  var gr = ctx.createLinearGradient(0, -size / 2, 0, size / 2); gr.addColorStop(0, "rgba(255,240,190,.75)"); gr.addColorStop(.5, "rgba(255,240,190,0)");
  ctx.fillStyle = gr; rr(-size / 2, -size / 2, size, size, size * .28); ctx.fill();
  var blink = (tNow % 3.4) < .12 ? .15 : 1, ex = face[0] * size * .1, ey = face[1] * size * .1;
  ctx.fillStyle = "#2A0F14";
  [-1, 1].forEach(function(k){ ctx.beginPath(); ctx.ellipse(k * size * .18 + ex, -size * .04 + ey, size * .08, size * .11 * blink, 0, 0, 6.283); ctx.fill(); });
  ctx.fillStyle = "rgba(215,38,46,.35)"; [-1, 1].forEach(function(k){ ctx.beginPath(); ctx.arc(k * size * .3 + ex * .5, size * .14 + ey * .5, size * .07, 0, 6.283); ctx.fill(); });
  ctx.restore();
}
function drawTutorial(){
  var s = B.s, p = (tNow % 1.6) / 1.6, sx = B.x + (disp.x + .5) * s, sy = B.y + (disp.y + 1.6) * s, ex = sx + s * 2.2 * Math.min(1, p * 1.4);
  ctx.globalAlpha = p < .85 ? 1 : (1 - p) / .15; ctx.font = (s * .7) + "px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.strokeStyle = "rgba(232,179,60,.6)"; ctx.lineWidth = 3; ctx.setLineDash([5, 6]); ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, sy); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillText("👆", ex, sy + s * .2); ctx.globalAlpha = 1;
}
var last = 0;
function frame(ts){
  requestAnimationFrame(frame); var dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts; tNow = ts / 1000;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = "#2A0F14"; ctx.fillRect(0, 0, W, H);
  if (!L){ return; }
  if (anim){
    anim.f += dt * 16;
    while (anim && anim.f >= 1){
      anim.f -= 1; var c = anim.path[anim.i], ev = c[2];
      disp.x = c[0]; disp.y = c[1];
      if (ev === "sw1"){ disp.par ^= 1; SFX.sw(); buzz(12); burst(c[0], c[1], COL[1], 12); }
      if (ev === "sw2"){ disp.par ^= 2; SFX.sw(); buzz(12); burst(c[0], c[1], COL[2], 12); }
      if (ev === "key"){ disp.km = anim.r.s.km & ((disp.km | (1 << L.keys.indexOf(c[0] + "," + c[1])))); disp.keys++; SFX.key(); buzz(15); burst(c[0], c[1], "#E8B33C", 16); hud(); }
      if (ev === "door"){ disp.dm |= 1 << L.doors.indexOf(c[0] + "," + c[1]); disp.keys--; SFX.door(); buzz(20); burst(c[0], c[1], "#8A5A2B", 14); hud(); }
      if (Math.random() < .9) particles.push({x: c[0] + .5, y: c[1] + .5, vx: 0, vy: 0, l: .6, c: "#E8B33C", r: B.s * .08});
      anim.i++; if (anim.i >= anim.path.length){ finishAnim(); break; }
    }
    if (anim){ var a = anim.i ? anim.path[anim.i - 1] : anim.from, b = anim.path[anim.i]; disp.x = a[0] + (b[0] - a[0]) * anim.f; disp.y = a[1] + (b[1] - a[1]) * anim.f; }
  }
  if (squash > 0) squash = Math.max(0, squash - dt * 5); if (bumpT > 0) bumpT = Math.max(0, bumpT - dt * 7);
  if (winT && winT < 1.2) winT += dt * 1.4;
  ctx.save(); if (shake > 0){ ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake *= .86; if (shake < .3) shake = 0; }
  drawBoard();
  for (var i = particles.length - 1; i >= 0; i--){ var p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .92; p.vy *= .92; p.l -= dt * 1.6; if (p.l <= 0){ particles.splice(i, 1); continue; }
    ctx.globalAlpha = Math.max(0, p.l); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(B.x + p.x * B.s, B.y + p.y * B.s, p.r, 0, 6.283); ctx.fill(); }
  ctx.globalAlpha = 1; drawHero(); if (tutorial && !anim) drawTutorial(); ctx.restore();
  if (flash > 0){ ctx.fillStyle = "rgba(" + flashCol + "," + flash * .35 + ")"; ctx.fillRect(0, 0, W, H); flash = Math.max(0, flash - dt * 2.5); }
}
resize(); setMute(); requestAnimationFrame(frame);
$("progStars").textContent = totalStars(); $("progMax").textContent = LEVELS.length * 3; applyLang();
// demo board behind the menu
L = AX.parse(LEVELS[Math.min(firstOpen(), LEVELS.length - 1)].rows); st = AX.init(L); disp = {x:st.x, y:st.y, par:0, km:0, dm:0, keys:0}; fit();
window.__aximore = {get st(){ return st; }, get li(){ return li; }, get anim(){ return !!anim; }, get winT(){ return winT; }, load: load, LEVELS: LEVELS};
})();
