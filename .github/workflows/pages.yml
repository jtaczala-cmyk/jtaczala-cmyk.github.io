# Deploys the Stop60 landing (user site) to GitHub Pages via Actions.
# With Actions publishing, GitHub ignores the CNAME file; the custom domain stop60.no is set in Settings -> Pages
# (persists across deployments). The CNAME file is kept only as documentation.
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh counters.json (counter strip on / and /daily/) from GoatCounter every ~30 min.
    - cron: '7,37 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          tar --exclude=./.git --exclude=./.github --exclude=./src --exclude=./_site --exclude=./README.md -cf - . | tar -xf - -C _site
          ls -la _site
      - name: Build counters.json from GoatCounter (token stays in Actions)
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 .github/scripts/counters.py _site/counters.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
