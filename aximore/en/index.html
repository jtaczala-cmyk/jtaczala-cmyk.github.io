<script>
/*ENGINE*/
var AX = (function(){
  var D = {U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]}, OW = {">":"R","<":"L","^":"U","v":"D"};
  function parse(rows){
    var L = {w: rows[0].length, h: rows.length, g: [], doors: [], keys: [], start: null};
    for (var y=0;y<L.h;y++) for (var x=0;x<L.w;x++){
      var c = rows[y][x]; if (c==="S"){L.start=[x,y]; c=".";}
      if (c==="D") L.doors.push(x+","+y); if (c==="k") L.keys.push(x+","+y);
      L.g.push(c);
    }
    return L;
  }
  function init(L){ return {x:L.start[0], y:L.start[1], par:0, keys:0, dm:0, km:0}; }
  function at(L,x,y){ return (x<0||y<0||x>=L.w||y>=L.h) ? "#" : L.g[y*L.w+x]; }
  function gateClosed(c, par){
    if (c==="R") return !(par&1); if (c==="r") return !!(par&1);
    if (c==="B") return !(par&2); if (c==="b") return !!(par&2);
    return false;
  }
  // returns null if no movement, else {s, path:[[x,y,ev]...], dead, win}
  function step(L, s0, dir){
    var d = D[dir], s = {x:s0.x,y:s0.y,par:s0.par,keys:s0.keys,dm:s0.dm,km:s0.km}, path = [], guard = 0;
    while (guard++ < 200){
      var nx = s.x+d[0], ny = s.y+d[1], c = at(L,nx,ny), ev = null;
      if (c==="#" || gateClosed(c,s.par)) break;
      if (OW[c] && OW[c]!==dir) break;
      if (c==="D"){ var di = L.doors.indexOf(nx+","+ny);
        if (!(s.dm & (1<<di))){ if (s.keys<1) break; s.keys--; s.dm |= 1<<di; ev = "door"; } }
      s.x = nx; s.y = ny;
      if (c==="X"){ path.push([nx,ny,"dead"]); return {s:s, path:path, dead:true}; }
      if (c==="k"){ var ki = L.keys.indexOf(nx+","+ny); if (!(s.km & (1<<ki))){ s.km |= 1<<ki; s.keys++; ev = "key"; } }
      if (c==="1"){ s.par ^= 1; ev = "sw1"; } if (c==="2"){ s.par ^= 2; ev = "sw2"; }
      path.push([nx,ny,ev]);
      if (c==="G") return {s:s, path:path, win:true};
      if (c==="o") break;
    }
    return path.length ? {s:s, path:path} : null;
  }
  function key(s){ return s.x+","+s.y+","+s.par+","+s.keys+","+s.dm+","+s.km; }
  function solve(L, limit){
    var s = init(L), q = [[s,0]], seen = {}, prev = {}; seen[key(s)] = 1; limit = limit || 200000;
    for (var i=0;i<q.length && q.length<limit;i++){
      var cur = q[i][0];
      for (var dir in D){ var r = step(L, cur, dir); if (!r || r.dead) continue;
        var k = key(r.s); if (seen[k]) continue; seen[k] = 1; prev[k] = [key(cur), dir];
        if (r.win){ var sol = [], kk = k; while (prev[kk]){ sol.unshift(prev[kk][1]); kk = prev[kk][0]; } return {moves: q[i][1]+1, sol: sol.join(""), states: q.length}; }
        q.push([r.s, q[i][1]+1]); }
    }
    return {moves: -1, states: q.length};
  }
  return {parse:parse, init:init, step:step, solve:solve, at:at, gateClosed:gateClosed, DIRS:D};
})();
if (typeof module !== "undefined") module.exports = AX;
/*ENDENGINE*/
</script>
